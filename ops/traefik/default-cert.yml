# Security control 09: stop Traefik presenting "TRAEFIK DEFAULT CERT".
#
# Without this, a TLS connection that names no known domain (the bare server IP,
# an unknown host) gets Traefik's self-signed certificate, whose name is
# CN=TRAEFIK DEFAULT CERT. That tells anyone the edge proxy is Traefik.
# With it, those connections get the real Let's Encrypt certificate for
# erp.ribdigihouse.com instead.
#
# Where it goes (server side, not deployed by the compose file):
#   Dokploy -> Traefik -> File System -> dynamic/ -> new file "default-cert.yml"
#   (on disk: /etc/dokploy/traefik/dynamic/default-cert.yml). Traefik reloads
#   files in that folder on its own; no restart needed.
#
# "letsencrypt" is the certificate resolver Dokploy configures in traefik.yml.
# If your traefik.yml names it differently, use that name.
#
# Check afterwards (should print the erp.ribdigihouse.com certificate):
#   echo | openssl s_client -connect <server-ip>:443 2>/dev/null | openssl x509 -noout -subject -issuer
tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: erp.ribdigihouse.com
