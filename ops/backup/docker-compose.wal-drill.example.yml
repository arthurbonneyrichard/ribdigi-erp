# Stage 26 W1 — optional operator staging overlay (not started by default CI/compose).
# Illustrates Postgres with WAL archive settings + MinIO for WAL / .ribbak offsite.
# Copy settings into a staging compose file; do not treat this as a production chart (see Stage 26 K1).

services:
  postgres-wal:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ribdigi
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ribdigi
      WAL_S3_BUCKET: ribdigi-wal
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    volumes:
      - ../postgres/postgresql-wal-archive.conf.example:/etc/postgresql/conf.d/wal.conf:ro
      - ../postgres/archive-wal-to-s3.sh.example:/usr/local/bin/archive-wal-to-s3.sh:ro
    # Operator must wire command/entrypoint to include conf.d and install awscli.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
