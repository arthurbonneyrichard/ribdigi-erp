name: deploy-staging-example-disabled
on:
  workflow_dispatch:
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Operator template only
        run: |
          echo "This file lives under ops/k8s/ as a template."
          echo "Do not treat it as a green staging deploy. See docs/STAGING_GHA_MVP.md."
          exit 0
