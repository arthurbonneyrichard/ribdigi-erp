# Stage 29 B2 — optional PgBouncer Deployment snippet (operator / staging only).
# NOT the default Helm data plane. NOT applied by CI or helm/ribdigi chart.
# Pair with ops/postgres/pgbouncer.ini.example ConfigMap/Secret and docs/PGBOUNCER_SOAK_PACK_MVP.md.
#
# Prerequisites:
#   - Namespace with Postgres reachable as postgres:5432 (or managed endpoint)
#   - Secret/userlist for auth_file; never commit real passwords
#   - App DATABASE_URL → pgbouncer:6432 with PGBOUNCER_TRANSACTION_MODE as needed
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: ribdigi-pgbouncer-config
  labels:
    app.kubernetes.io/name: ribdigi-pgbouncer
    ribdigi.io/stage: "29-b2-example"
data:
  # Mount over /etc/pgbouncer/pgbouncer.ini — copy from ops/postgres/pgbouncer.ini.example
  pgbouncer.ini: |
    ; Replace host/password via operator Secret; example only.
    [databases]
    ribdigi_erp = host=postgres port=5432 dbname=ribdigi_erp
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 20
    admin_users = ribdigi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ribdigi-pgbouncer
  labels:
    app.kubernetes.io/name: ribdigi-pgbouncer
    ribdigi.io/stage: "29-b2-example"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ribdigi-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ribdigi-pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.1-p0
          ports:
            - containerPort: 6432
              name: pgbouncer
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
          # Operator must wire userlist Secret + readiness; do not treat this as green apply.
      volumes:
        - name: config
          configMap:
            name: ribdigi-pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: ribdigi-pgbouncer
    ribdigi.io/stage: "29-b2-example"
spec:
  selector:
    app.kubernetes.io/name: ribdigi-pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432

# Explicitly deferred: default in-cluster Helm pooler Complete; live soak certification in CI.
