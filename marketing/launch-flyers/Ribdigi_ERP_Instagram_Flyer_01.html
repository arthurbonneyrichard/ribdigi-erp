<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ribdigi ERP Instagram Flyer 01: Launch</title>
<link rel="stylesheet" href="ig-base.css">
<style>
  /* Concept: a launch-day calendar page on deep forest green. */
  .post {
    background:
      radial-gradient(520px 420px at 85% 8%, rgba(74, 176, 18, 0.45), transparent 70%),
      radial-gradient(620px 520px at 0% 100%, rgba(0, 107, 46, 0.7), transparent 70%),
      var(--forest-deep);
    color: #fff;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(200, 232, 106, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 232, 106, 0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .logo { position: absolute; top: 84px; left: 50%; width: 520px; margin-left: -260px; }
  .head { position: absolute; top: 300px; left: var(--safe); right: var(--safe); text-align: center; }
  .head h1 { font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; }
  .head h1 span { color: var(--brand-light); }

  .cal {
    position: absolute; top: 540px; left: 50%; width: 470px; margin-left: -235px;
    background: #fff; border-radius: 40px; overflow: hidden; text-align: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    transform: rotate(-3deg);
  }
  .cal .top {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-size: 44px; font-weight: 800; letter-spacing: 6px; padding: 26px 0 22px;
  }
  .cal .rings { position: absolute; top: -14px; left: 0; right: 0; display: flex; justify-content: center; gap: 220px; }
  .cal .rings i { width: 30px; height: 46px; border-radius: 16px; background: var(--forest); display: block; }
  .cal .day { font-size: 270px; line-height: 0.95; font-weight: 800; color: var(--forest); letter-spacing: -8px; padding-top: 18px; }
  .cal .year { font-size: 52px; font-weight: 800; color: var(--brand-dark); letter-spacing: 4px; padding: 6px 0 30px; }

  .slogan { position: absolute; top: 1052px; left: var(--safe); right: var(--safe); text-align: center; font-size: 46px; }
  .slogan em { color: var(--brand-light); }

  .panel {
    position: absolute; left: var(--safe); right: var(--safe); bottom: var(--safe);
    background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(200, 232, 106, 0.35);
    border-radius: 32px; padding: 30px 34px;
  }
  .contacts .ic { background: var(--brand-light); color: var(--forest); }
</style>
</head>
<body>
<div class="post">
  <div class="grid-bg"></div>
  <img class="logo" src="assets/ribdigi-erp-logo-light-text.png" alt="Ribdigi ERP">

  <div class="head">
    <h1>Ribdigi ERP<br><span>is launching</span></h1>
  </div>

  <div class="cal" aria-label="2 November 2026">
    <div class="rings"><i></i><i></i></div>
    <div class="top">NOVEMBER</div>
    <div class="day">2</div>
    <div class="year">2026</div>
  </div>

  <p class="slogan">Run smarter. <em>Sell faster.</em> Grow better.</p>

  <div class="panel">
    <div class="contacts">
      <div class="c"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg></span><span><small>Phone</small>0302 944 376</span></div>
      <div class="c"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg></span><span><small>WhatsApp</small>0530537307</span></div>
      <div class="c"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span><span><small>Website</small>ribdigihouse.com</span></div>
      <div class="c"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg></span><span><small>Instagram · TikTok</small>@ribdigihouse</span></div>
    </div>
  </div>
</div>
</body>
</html>
