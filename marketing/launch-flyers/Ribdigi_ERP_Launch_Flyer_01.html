<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ribdigi ERP Launch Flyer 01</title>
<link rel="stylesheet" href="flyer-base.css">
<style>
  .page {
    background:
      radial-gradient(120mm 120mm at 105% -5%, rgba(200, 232, 106, 0.28), transparent 70%),
      radial-gradient(150mm 130mm at -20% 105%, rgba(74, 176, 18, 0.35), transparent 70%),
      linear-gradient(165deg, #003d1f 0%, #002815 55%, #001a0e 100%);
    color: #fff;
  }
  .rings {
    position: absolute; right: -40mm; top: 58mm; width: 150mm; height: 150mm;
    border-radius: 50%; border: 0.5mm solid rgba(200, 232, 106, 0.18);
    box-shadow: 0 0 0 14mm rgba(200, 232, 106, 0.05), 0 0 0 30mm rgba(200, 232, 106, 0.035);
  }
  .top { position: absolute; left: 16mm; right: 16mm; top: 15mm; display: flex; justify-content: space-between; align-items: center; }
  .top .logo { width: 82mm; }
  .tag {
    font-size: 3.4mm; font-weight: 800; letter-spacing: 0.6mm; text-transform: uppercase;
    color: var(--forest); background: var(--brand-light); padding: 2.2mm 4.2mm; border-radius: 99mm;
  }
  .headline { position: absolute; left: 16mm; right: 16mm; top: 50mm; }
  .eyebrow { font-size: 5mm; font-weight: 700; color: var(--brand-light); letter-spacing: 0.3mm; }
  h1 { font-size: 21mm; line-height: 0.98; font-weight: 800; letter-spacing: -0.6mm; margin-top: 3mm; }
  h1 .hl { color: var(--brand-light); }
  .date {
    position: absolute; left: 16mm; top: 108mm;
    display: flex; align-items: stretch; gap: 0;
    border-radius: 6mm; overflow: hidden; box-shadow: 0 4mm 12mm rgba(0, 0, 0, 0.35);
  }
  .date .day {
    background: var(--brand-light); color: var(--forest);
    font-size: 30mm; font-weight: 800; line-height: 1; padding: 5mm 7mm 4mm; display: flex; align-items: center;
  }
  .date .rest { background: #fff; color: var(--forest); padding: 6mm 9mm 6mm 8mm; display: flex; flex-direction: column; justify-content: center; }
  .date .month { font-size: 13mm; font-weight: 800; line-height: 1; letter-spacing: -0.3mm; }
  .date .year { font-size: 8mm; font-weight: 700; color: var(--brand-dark); margin-top: 1.5mm; }
  .slogan { position: absolute; left: 16mm; right: 16mm; top: 152mm; font-size: 7.6mm; color: #fff; }
  .slogan span { color: var(--brand-light); }
  .screen { position: absolute; left: 16mm; right: 16mm; top: 174mm; }
  .screen .frame { border-color: rgba(200, 232, 106, 0.55); }
  .caption { margin-top: 2.6mm; font-size: 3.4mm; color: rgba(255, 255, 255, 0.72); text-align: center; }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 7mm 16mm 9mm;
    background: rgba(0, 0, 0, 0.32); border-top: 0.5mm solid rgba(200, 232, 106, 0.35);
  }
  .foot .contact { color: #fff; }
  .foot svg { color: var(--brand-light); }
</style>
</head>
<body>
<div class="page">
  <div class="rings"></div>
  <div class="top">
    <img class="logo" src="assets/ribdigi-erp-logo-light-text.png" alt="Ribdigi ERP">
    <span class="tag">Launch</span>
  </div>

  <div class="headline">
    <p class="eyebrow">For retail businesses</p>
    <h1>Ribdigi ERP<br>is <span class="hl">launching</span></h1>
  </div>

  <div class="date" aria-label="Launch date 2 November 2026">
    <div class="day">2</div>
    <div class="rest">
      <span class="month">November</span>
      <span class="year">2026</span>
    </div>
  </div>

  <p class="slogan">Run smarter. <span>Sell faster.</span> Grow better.</p>

  <div class="screen">
    <div class="frame crop" style="height:62mm"><img class="shot" src="assets/erp-dashboard.png" alt="Ribdigi ERP dashboard"></div>
    <p class="caption">The Ribdigi ERP dashboard</p>
  </div>

  <div class="foot">
    <div class="contact">
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>
        <span><span class="label">Phone</span>0302 944 376</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
        <span><span class="label">WhatsApp</span>0530537307</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span><span class="label">Website</span>ribdigihouse.com</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
