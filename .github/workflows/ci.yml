name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app backend/scripts
      # Stage 18 C1 — explicit security/isolation/store_scope marker pass (subset), then full suite
      - name: Pytest security, isolation, and store_scope markers
        run: cd backend && PYTHONPATH=. pytest -q -m "security or isolation or store_scope"
      - name: Pytest living store-scope RBAC matrix
        run: cd backend && PYTHONPATH=. pytest -q tests/test_store_scope_rbac_matrix.py
      - name: Pytest full suite
        run: cd backend && PYTHONPATH=. pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd frontend && npm install && npm run build
  # Explicitly no Kubernetes / Helm deploy job (Stage 18 C1 out of scope).
