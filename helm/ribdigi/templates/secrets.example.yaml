# EXAMPLE ONLY — do not apply with real secrets committed to git.
# Stage 26 K1 documents required keys from .env.production.example.
# Create live secret:
#   kubectl -n <ns> create secret generic ribdigi-secrets --from-env-file=.env.production
apiVersion: v1
kind: Secret
metadata:
  name: ribdigi-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  APP_ENV: production
  JWT_SECRET_KEY: REPLACE_ME_MIN_32_CHARS________________
  # SEC-M4 — dedicated Fernet keys (Fernet.generate_key()); never reuse JWT_SECRET_KEY
  TOTP_ENCRYPTION_KEY: REPLACE_WITH_FERNET_generate_key_OUTPUT________________
  BACKUP_ENCRYPTION_KEY: REPLACE_WITH_FERNET_generate_key_OUTPUT________________
  DATABASE_URL: postgresql+asyncpg://user:pass@managed-pg:5432/ribdigi
  REDIS_URL: redis://managed-redis:6379/0
  CELERY_BROKER_URL: amqp://user:pass@managed-rabbit:5672//
  CORS_ORIGINS: https://app.example.com
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REQUIRE_REDIS: "true"
  METRICS_ENABLED: "true"
  REQUEST_LOG_ENABLED: "true"
