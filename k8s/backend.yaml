apiVersion: apps/v1
kind: Deployment
metadata: {name: ribdigi-backend}
spec:
 replicas: 2
 selector: {matchLabels: {app: ribdigi-backend}}
 template:
  metadata: {labels: {app: ribdigi-backend}}
  spec:
   containers:
   - name: backend
     image: ribdigi/erp-backend:1.0.0
     ports: [{containerPort: 8000}]
     envFrom: [{secretRef: {name: ribdigi-secrets}}]
---
apiVersion: v1
kind: Service
metadata: {name: ribdigi-backend}
spec: {selector: {app: ribdigi-backend}, ports: [{port: 8000,targetPort: 8000}]}
