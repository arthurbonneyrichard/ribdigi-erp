# Stage 26 K1 — Celery worker (command matches docker-compose.yml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ribdigi-celery-worker
  labels:
    app: ribdigi-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ribdigi-celery-worker
  template:
    metadata:
      labels:
        app: ribdigi-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ribdigi/erp-backend:1.0.0
          command:
            - celery
            - -A
            - app.celery_app.celery
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - secretRef:
                name: ribdigi-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
