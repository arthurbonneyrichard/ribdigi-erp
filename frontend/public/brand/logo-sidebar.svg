<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="RIBDIGI ERP">
  <!-- Transparent writing / wordmark logo for dark sidebar (matches logo-wordmark.png; no sticker fill, no RD mark) -->
  <defs>
    <linearGradient id="ribdigiWordBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001d3d"/>
      <stop offset="42%" stop-color="#003380"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>
    <linearGradient id="ribdigiWordGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Writing logo: RIBDIGI | ERP -->
  <text
    x="230"
    y="58"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="900"
    letter-spacing="1.5"
  >
    <tspan fill="url(#ribdigiWordBlue)">RIBDIGI</tspan>
    <tspan fill="#94a3b8" dx="6">|</tspan>
    <tspan fill="url(#ribdigiWordGreen)" dx="6">ERP</tspan>
  </text>
  <!-- Tagline with flanking rules (light for dark sidebar) -->
  <line x1="48" y1="82" x2="118" y2="82" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text
    x="230"
    y="88"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="2.2"
    fill="#cbd5e1"
  >RUN YOUR BUSINESS SMARTER</text>
  <line x1="342" y1="82" x2="412" y2="82" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
